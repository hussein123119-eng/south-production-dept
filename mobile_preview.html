<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>محاكي الهاتف الذكي | إدارة قسم الإنتاج الجنوبي</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23006a6a'/><text x='50' y='65' font-size='42' font-family='Arial' font-weight='bold' text-anchor='middle' fill='white'>📱</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0a0f1d;
      --bg-panel: rgba(15, 23, 42, 0.85);
      --border-glow: rgba(56, 189, 248, 0.25);
      --primary: #0284c7;
      --accent: #38bdf8;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --bezel-color: #1e293b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Cairo', 'Tajawal', sans-serif;
      background: radial-gradient(circle at 50% 20%, #1e1b4b 0%, #0a0f1d 70%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      user-select: none;
    }

    /* Top Simulator Command Bar */
    .sim-header {
      background: rgba(11, 19, 38, 0.92);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding: 0.75rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
      z-index: 100;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }

    .sim-brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .sim-logo {
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, #0284c7, #0369a1);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
      box-shadow: 0 0 15px rgba(2, 132, 199, 0.5);
    }

    .sim-title h1 {
      font-size: 1.1rem;
      font-weight: 800;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .sim-title p {
      font-size: 0.75rem;
      color: var(--accent);
      font-weight: 600;
    }

    .sim-controls {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      flex-wrap: wrap;
    }

    .control-group {
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      padding: 3px;
      display: flex;
      align-items: center;
      gap: 3px;
    }

    .btn-sim {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 0.4rem 0.75rem;
      border-radius: 7px;
      font-family: inherit;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      transition: all 0.2s ease;
    }

    .btn-sim:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.08);
    }

    .btn-sim.active {
      background: linear-gradient(135deg, #0284c7, #2563eb);
      color: #fff;
      box-shadow: 0 0 12px rgba(2, 132, 199, 0.4);
    }

    .btn-action {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      padding: 0.45rem 0.9rem;
      border-radius: 9px;
      font-family: inherit;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      transition: all 0.2s ease;
    }

    .btn-action:hover {
      background: rgba(255, 255, 255, 0.18);
      border-color: var(--accent);
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.3);
    }

    /* Simulator Stage Workspace */
    .sim-workspace {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
      position: relative;
      overflow: auto;
    }

    /* Phone Device Mockup Container */
    .device-wrapper {
      position: relative;
      transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      filter: drop-shadow(0 25px 50px rgba(0, 0, 0, 0.8)) drop-shadow(0 0 35px rgba(2, 132, 199, 0.25));
    }

    .device-chassis {
      background: #0f172a;
      border: 12px solid #1e293b;
      border-radius: 48px;
      position: relative;
      box-shadow: 
        inset 0 0 0 2px rgba(255, 255, 255, 0.15),
        0 0 0 3px #0b1120,
        0 20px 40px rgba(0, 0, 0, 0.7);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: all 0.3s ease;
    }

    /* Dynamic Island / Camera Notch */
    .device-island {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      width: 110px;
      height: 28px;
      background: #000;
      border-radius: 20px;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);
      pointer-events: none;
    }

    .island-lens {
      width: 10px;
      height: 10px;
      background: #111827;
      border: 1.5px solid #1f2937;
      border-radius: 50%;
    }

    .island-sensor {
      width: 7px;
      height: 7px;
      background: #052e16;
      border-radius: 50%;
    }

    /* Mobile Status Bar */
    .device-statusbar {
      height: 42px;
      background: #006a6a;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      font-size: 0.78rem;
      font-weight: 700;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      direction: ltr;
      z-index: 40;
      user-select: none;
      flex-shrink: 0;
    }

    .statusbar-icons {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Target Web App Frame */
    .device-screen-iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: #ffffff;
      flex: 1;
    }

    /* Quick Test Bottom Bar */
    .sim-quick-bar {
      background: rgba(15, 23, 42, 0.95);
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      padding: 0.6rem 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      flex-wrap: wrap;
      z-index: 90;
      font-size: 0.82rem;
    }

    .quick-pill {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #e2e8f0;
      padding: 0.35rem 0.75rem;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s ease;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
    }

    .quick-pill:hover {
      background: rgba(2, 132, 199, 0.25);
      border-color: var(--accent);
      color: #fff;
    }

    /* Device Dimension Specs */
    .dim-iphone {
      width: 393px;
      height: 840px;
    }
    .dim-galaxy {
      width: 360px;
      height: 780px;
    }
    .dim-max {
      width: 430px;
      height: 900px;
    }
    .dim-compact {
      width: 320px;
      height: 640px;
    }
    .dim-tablet {
      width: 768px;
      height: 960px;
    }

    /* Landscape Mode */
    .landscape.dim-iphone { width: 840px; height: 393px; }
    .landscape.dim-galaxy { width: 780px; height: 360px; }
    .landscape.dim-max { width: 900px; height: 430px; }
    .landscape.dim-compact { width: 640px; height: 320px; }
    .landscape.dim-tablet { width: 960px; height: 768px; }

    .landscape .device-island {
      top: 50%;
      left: 10px;
      transform: translateY(-50%) rotate(90deg);
    }
  </style>
</head>
<body>

  <!-- 1. Simulator Top Toolbar -->
  <header class="sim-header">
    <div class="sim-brand">
      <div class="sim-logo">📱</div>
      <div class="sim-title">
        <h1>محاكي الهاتف الذكي المباشر</h1>
        <p>قسم الإنتاج الجنوبي — فحص الاستجابة وتجربة المستخدم</p>
      </div>
    </div>

    <div class="sim-controls">
      <!-- Device Switcher -->
      <div class="control-group">
        <button class="btn-sim active" onclick="setDevice('iphone', this)">📱 iPhone 15</button>
        <button class="btn-sim" onclick="setDevice('galaxy', this)">📱 Galaxy S24</button>
        <button class="btn-sim" onclick="setDevice('max', this)">📱 Pro Max</button>
        <button class="btn-sim" onclick="setDevice('compact', this)">📱 Compact</button>
        <button class="btn-sim" onclick="setDevice('tablet', this)">📟 Tablet</button>
      </div>

      <!-- Orientation Switcher -->
      <div class="control-group">
        <button class="btn-sim active" id="btnPortrait" onclick="setOrientation('portrait')">↕️ عمودي</button>
        <button class="btn-sim" id="btnLandscape" onclick="setOrientation('landscape')">↔️ أفقي</button>
      </div>

      <!-- Scale Zoom -->
      <div class="control-group">
        <button class="btn-sim" onclick="setScale(0.8, this)">80%</button>
        <button class="btn-sim active" id="scale100" onclick="setScale(1, this)">100%</button>
        <button class="btn-sim" onclick="setScale(0.9, this)">90%</button>
      </div>

      <!-- Actions -->
      <button class="btn-action" onclick="reloadFrame()" title="إعادة تحميل شاشة التطبيق">
        🔄 تحديث
      </button>

      <a href="index.html" target="_blank" class="btn-action" style="text-decoration:none;" title="فتح في نافذة كاملة">
        ↗️ فتح مباشر
      </a>
    </div>
  </header>

  <!-- 2. Device Viewport Workspace -->
  <main class="sim-workspace" id="workspaceArea">
    <div class="device-wrapper" id="deviceWrapper">
      <div class="device-chassis dim-iphone" id="deviceChassis">
        <!-- Dynamic Island Notch -->
        <div class="device-island" id="deviceIsland">
          <div class="island-lens"></div>
          <div class="island-sensor"></div>
        </div>

        <!-- Phone Status Bar -->
        <div class="device-statusbar">
          <span id="livePhoneClock">12:00</span>
          <div class="statusbar-icons">
            <span>5G</span>
            <span>📶</span>
            <span>🔋 98%</span>
          </div>
        </div>

        <!-- Embedded Web App -->
        <iframe src="index.html" class="device-screen-iframe" id="appIframe"></iframe>
      </div>
    </div>
  </main>

  <!-- 3. Bottom Quick Navigation Tester -->
  <footer class="sim-quick-bar">
    <span style="color: var(--text-muted); font-weight: 700;">⚡ تسجيل الدخول السريع (بيئة محلية - الرمز: 123456):</span>
    <button class="quick-pill" style="background: rgba(245, 158, 11, 0.22); border-color: rgba(245, 158, 11, 0.5); color: #fbbf24; font-weight: 800;" onclick="quickLoginInFrame('EMP-0000', '123456')">👑 المؤسس (EMP-0000)</button>
    <button class="quick-pill" onclick="quickLoginInFrame('EMP-2024-001', '123456')">👔 مدير القسم</button>
    <button class="quick-pill" onclick="quickLoginInFrame('EMP-2024-002', '123456')">🏢 الشعبة 1</button>
    <button class="quick-pill" onclick="quickLoginInFrame('EMP-2024-005', '123456')">⚙️ الوحدة الفنية</button>
    <button class="quick-pill" onclick="quickLoginInFrame('EMP-2024-004', '123456')">👷 عمار (مشغل)</button>
    <span style="color: rgba(255,255,255,0.2); margin: 0 4px;">|</span>
    <span style="color: var(--text-muted); font-weight: 700;">اختصارات الشاشات:</span>
    <button class="quick-pill" onclick="sendNav('dashboard')">🏠 الرئيسية</button>
    <button class="quick-pill" onclick="sendNav('incentive_calculator')">🧮 حاسبة الحوافز</button>
    <button class="quick-pill" onclick="sendNav('promotion_calculator')">📈 حاسبة الترفيع</button>
    <button class="quick-pill" onclick="sendNav('dept_management')">🏛️ إدارة القسم</button>
    <button class="quick-pill" onclick="toggleSidebarInFrame()">📂 الشريط الجانبي</button>
    <button class="quick-pill" onclick="toggleThemeInFrame()">🌓 المظهر</button>
  </footer>

  <script>
    let currentDevice = 'iphone';
    let currentOrientation = 'portrait';
    let currentScale = 1;

    function updateLiveClock() {
      const now = new Date();
      let h = now.getHours();
      let m = String(now.getMinutes()).padStart(2, '0');
      h = h % 12 || 12;
      document.getElementById('livePhoneClock').textContent = h + ':' + m;
    }
    setInterval(updateLiveClock, 1000);
    updateLiveClock();

    function setAppMode(srcUrl, btnEl) {
      const iframe = document.getElementById('appIframe');
      iframe.src = srcUrl;
      document.getElementById('btnDirectLink').href = srcUrl;
      document.getElementById('btnModeMobile').classList.toggle('active', srcUrl.includes('mobile'));
      document.getElementById('btnModeDesktop').classList.toggle('active', !srcUrl.includes('mobile'));
    }

    function setDevice(device, btnEl) {
      currentDevice = device;
      document.querySelectorAll('.sim-controls .control-group:first-child .btn-sim').forEach(b => b.classList.remove('active'));
      if (btnEl) btnEl.classList.add('active');
      applyDeviceClasses();
    }

    function setOrientation(orient) {
      currentOrientation = orient;
      document.getElementById('btnPortrait').classList.toggle('active', orient === 'portrait');
      document.getElementById('btnLandscape').classList.toggle('active', orient === 'landscape');
      applyDeviceClasses();
    }

    function applyDeviceClasses() {
      const chassis = document.getElementById('deviceChassis');
      chassis.className = 'device-chassis dim-' + currentDevice + (currentOrientation === 'landscape' ? ' landscape' : '');
      
      const island = document.getElementById('deviceIsland');
      if (currentDevice === 'tablet') {
        island.style.display = 'none';
        chassis.style.borderRadius = '24px';
        chassis.style.borderWidth = '14px';
      } else {
        island.style.display = 'flex';
        chassis.style.borderRadius = '48px';
        chassis.style.borderWidth = '12px';
      }
    }

    function setScale(scale, btnEl) {
      currentScale = scale;
      const wrapper = document.getElementById('deviceWrapper');
      wrapper.style.transform = 'scale(' + scale + ')';
      document.querySelectorAll('.control-group:nth-child(3) .btn-sim').forEach(b => b.classList.remove('active'));
      if (btnEl) btnEl.classList.add('active');
    }

    function reloadFrame() {
      const iframe = document.getElementById('appIframe');
      iframe.src = iframe.src;
    }

    function quickLoginInFrame(identifier, password) {
      const iframe = document.getElementById('appIframe');
      try {
        if (iframe.contentWindow) {
          // Check MobileApp controller first
          if (iframe.contentWindow.mobileApp && typeof iframe.contentWindow.mobileApp.quickFillLogin === 'function') {
            iframe.contentWindow.mobileApp.quickFillLogin(identifier, password);
            return;
          }
          // Check Desktop app controller
          if (iframe.contentWindow.app && typeof iframe.contentWindow.app.quickFillLogin === 'function') {
            iframe.contentWindow.app.quickFillLogin(identifier, password);
          }
          if (iframe.contentWindow.auth && typeof iframe.contentWindow.auth.login === 'function') {
            const res = iframe.contentWindow.auth.login(identifier, password);
            if (res && res.success) {
              if (iframe.contentWindow.app && typeof iframe.contentWindow.app.render === 'function') {
                iframe.contentWindow.app.navigate('dashboard');
              }
            }
          }
        }
      } catch (e) {
        console.error('quickLoginInFrame error:', e);
      }
    }

    function sendNav(viewName) {
      const iframe = document.getElementById('appIframe');
      try {
        if (iframe.contentWindow) {
          if (iframe.contentWindow.mobileApp && typeof iframe.contentWindow.mobileApp.navigate === 'function') {
            iframe.contentWindow.mobileApp.navigate(viewName);
            return;
          }
          if (iframe.contentWindow.app && typeof iframe.contentWindow.app.navigate === 'function') {
            iframe.contentWindow.app.navigate(viewName);
          }
        }
      } catch (e) {
        console.error('Cross-origin/Navigation error:', e);
      }
    }

    function toggleThemeInFrame() {
      const iframe = document.getElementById('appIframe');
      try {
        if (iframe.contentWindow) {
          if (iframe.contentWindow.mobileApp && typeof iframe.contentWindow.mobileApp.toggleTheme === 'function') {
            iframe.contentWindow.mobileApp.toggleTheme();
            return;
          }
          if (iframe.contentWindow.app && typeof iframe.contentWindow.app.toggleTheme === 'function') {
            iframe.contentWindow.app.toggleTheme();
          }
        }
      } catch (e) {
        console.error('Theme toggle error:', e);
      }
    }

    function checkAutoFit() {
      const availH = window.innerHeight - 160;
      if (availH < 850 && currentScale === 1) {
        setScale(0.85, null);
      }
    }
    window.addEventListener('resize', checkAutoFit);
    checkAutoFit();
  </script>
</body>
</html>
