name: Deploy to Firebase Hosting on Merge

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify Secret Presence
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SOUTH_PROD_RUMAILA }}
        run: |
          if [ -z "$SA" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT_SOUTH_PROD_RUMAILA secret is missing or empty in repo settings!"
            exit 1
          else
            echo "Service account secret found with length ${#SA}"
          fi

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_SOUTH_PROD_RUMAILA }}'
          channelId: live
          projectId: south-prod-rumaila
