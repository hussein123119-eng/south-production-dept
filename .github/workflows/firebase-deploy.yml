name: Deploy to Firebase Hosting on Merge

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SOUTH_PROD_RUMAILA }}

      - name: Deploy to Firebase Hosting via Firebase CLI
        run: |
          npx -y firebase-tools@latest deploy --only hosting --project south-prod-rumaila --non-interactive
